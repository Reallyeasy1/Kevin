name: ci

on:
  push:
    branches: [main]
  pull_request:

# Unit, integration (mocked) and mocked e2e only. Live Testnet tests are manual (PRD §18.3).
jobs:
  verify:
    runs-on: ubuntu-latest
    # Real Postgres so migrations are applied and the DB-backed tests run (they skip without DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subbuddy
          POSTGRES_PASSWORD: subbuddy
          POSTGRES_DB: subbuddy
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U subbuddy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://subbuddy:subbuddy@localhost:5432/subbuddy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @subbuddy/database db:migrate
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
